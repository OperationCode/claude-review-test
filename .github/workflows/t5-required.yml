name: t5-required

# T5: required workflow for the org ruleset rule "Require workflows to pass before merging".
# Result comes from the repo variable T5_GATE ("failure" fails, anything else passes).
# Q2 job states (repo variables, trusted, set by the owner only):
#   T5_SLEEP=<seconds>  job stays in progress that long before it reports (pending state)
#   T5_SKIP=true        job is skipped (skipped state)
# Ruleset workflows run on the default activity types only (opened, synchronize, reopened);
# the types filter below is ignored by the ruleset and only matters for a normal run.
# Do not add cancel-in-progress concurrency (GitHub lists it as a cause of failure).
#
# No checkout, no third-party actions, no token scopes, no secrets, no PR text in scripts.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  t5-gate:
    name: t5-gate
    if: vars.T5_SKIP != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions: {}
    env:
      GATE: ${{ vars.T5_GATE }}
      SLEEP: ${{ vars.T5_SLEEP }}
      WORKFLOW_VERSION: v1
      WORKFLOW_REF: ${{ github.workflow_ref }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      GITHUB_REF_VALUE: ${{ github.ref }}
      BASE_SHA: ${{ github.sha }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_ACTION: ${{ github.event.action }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      REPO: ${{ github.repository }}
    steps:
      - name: Gate
        run: |
          {
            echo "### t5-required (self-contained gate)"
            echo "- version: $WORKFLOW_VERSION"
            echo "- gate variable T5_GATE: ${GATE:-<unset>}, T5_SLEEP: ${SLEEP:-<unset>}"
            echo "- event: $EVENT_NAME / $EVENT_ACTION"
            echo "- pr number (event payload): $PR_NUMBER"
            echo "- repository: $REPO, head repository: $HEAD_REPO (fork: $([ "$HEAD_REPO" = "$REPO" ] && echo no || echo yes))"
            echo "- head sha: $HEAD_SHA, github.sha: $BASE_SHA, github.ref: $GITHUB_REF_VALUE"
            echo "- workflow_ref: $WORKFLOW_REF"
            echo "- workflow_sha: $WORKFLOW_SHA"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          case "$SLEEP" in
            ''|*[!0-9]*) ;;
            *) echo "gate: sleeping $SLEEP s (pending state)"; sleep "$SLEEP" ;;
          esac
          if [ "$GATE" = "failure" ]; then
            echo "gate: failing on purpose"
            exit 1
          fi
          echo "gate: success"
